<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PUA6027 政策实验室</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-code">PUA6027</span>
        <span class="brand-title">政策实验室</span>
      </div>
      <div class="brand-sub">科技、创新与政策 · 模拟决策系统</div>
    </div>
  </header>

  <main class="container">
    <section class="card intro">
      <p>欢迎就任本模拟经济体的政策委员会。你将按课程进度逐期制定政策，系统会依据政策属性推演其执行结果，并持续追踪各项社会发展指标。请特别留意：<strong>意图良好的政策未必能全额落地</strong>——执行落差正是本课程的核心理念之一。</p>
    </section>

    <div id="stepper" class="stepper"></div>

    <section id="mechanism" class="card"></section>

    <section class="card">
      <h2 class="section-title">社会发展指标</h2>
      <div id="dashboard"></div>
    </section>

    <section class="card">
      <div id="period"></div>
    </section>

    <section class="card">
      <div id="trail"></div>
    </section>

    <section id="verdict"></section>
  </main>

  <footer class="site-footer">
    <p>PUA6027 政策实验室 · 教学模拟原型 · 仅供课堂演示</p>
  </footer>

  <script src="js/engine.js"></script>
  <script src="data/policies.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
